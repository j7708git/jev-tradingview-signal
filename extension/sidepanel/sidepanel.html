<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jev Signal</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header class="top">
      <div class="top-row">
        <h1 class="brand">Jev Signal</h1>
        <button
          id="open-options-btn"
          class="ghost open-options"
          type="button"
          data-action="open-options"
          title="開啟擴充設定"
        >⚙ 設定</button>
      </div>
      <div id="status-line" class="status-line">圖表：等待中</div>
    </header>

    <main class="main">
      <button id="predict-btn" class="primary" type="button" disabled>預測</button>
      <p id="hint" class="hint"></p>
      <section id="result" class="result" aria-live="polite"></section>

      <details id="studies-map-block" class="studies-map">
        <summary>指標映射</summary>
        <div id="studies-map" class="studies-map-body"></div>
      </details>

      <details id="debug" class="debug">
        <summary>除錯</summary>
        <div id="debug-counters" class="debug-counters">dropped=0 · ignoredSeriesFrames=0</div>
        <div class="debug-actions">
          <button id="resync-btn" class="ghost" type="button">重同步</button>
        </div>
        <div id="ring-log" class="ring-log"><p class="ring-empty">—</p></div>
      </details>
    </main>

    <footer class="footer">
      <p class="disclaimer">僅供研究參考，不構成投資建議</p>
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
